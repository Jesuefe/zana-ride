apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    // Release signing. The keystore never lives in the repo — CI writes it
    // from a secret at build time, and a local build falls back to unsigned
    // so nothing breaks for a developer without the key.
    signingConfigs {
        release {
            if (project.hasProperty('ZANA_KEYSTORE_FILE')) {
                storeFile file(ZANA_KEYSTORE_FILE)
                storePassword ZANA_KEYSTORE_PASSWORD
                keyAlias ZANA_KEY_ALIAS
                keyPassword ZANA_KEY_PASSWORD
            }
        }
    }

    namespace "rw.zanaride.driver"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "rw.zanaride.driver"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion

        // Read release version inputs defensively. Gradle can expose an
        // explicitly supplied property as null in some configuration paths,
        // so normalize it before Android's versionCode/versionName APIs see it.
        def zanaVersionCode = project.findProperty("ZANA_VERSION_CODE")
        def zanaVersionName = project.findProperty("ZANA_VERSION_NAME")
        versionCode zanaVersionCode == null ? 1 : zanaVersionCode.toString().toInteger()
        versionName zanaVersionName == null ? "1.0" : zanaVersionName.toString()

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Mapbox's SDK takes its public runtime token as a string resource,
        // not a manifest tag — this generates R.string.mapbox_access_token
        // at build time from the CI secret, so no real token is ever
        // committed. This is the PUBLIC token (used while the app runs);
        // the separate MAPBOX_DOWNLOADS_TOKEN above is only used to
        // authenticate downloading the SDK itself during the build.
        resValue "string", "mapbox_access_token", (project.findProperty("MAPBOX_ACCESS_TOKEN") ?: "").toString()

        aaptOptions {
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }

    buildTypes {
        release {
            if (project.hasProperty('ZANA_KEYSTORE_FILE')) {
                signingConfig signingConfigs.release
            }
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"
    implementation "org.jetbrains.kotlin:kotlin-stdlib:2.0.0"

    implementation 'com.mapbox.maps:android:11.8.0'
    implementation 'com.mapbox.navigationcore:android:3.27.0'

    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
