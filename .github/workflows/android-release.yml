name: Build Android release (AAB)

# Google Play needs a signed Android App Bundle, not the debug APK from the
# other workflow. Run this when you are ready to upload to the Play Console.
#
# Requires four repository secrets:
#   ANDROID_KEYSTORE_BASE64   the .jks file, base64 encoded
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
#
# Guard the keystore carefully. Lose it and you cannot ship an update to an
# app already on Play under the same identity.

on:
  workflow_dispatch:
    inputs:
      app:
        description: 'Which Android app should be built?'
        required: true
        type: choice
        options:
          - driver
          - customer
        default: driver
      versionName:
        description: 'Version name, e.g. 1.0.0'
        required: true
        default: '1.0.0'
      versionCode:
        description: 'Version code — must increase with every upload'
        required: true
        default: '1'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: native/${{ inputs.app }}
        run: npm install

      - name: Sync Capacitor
        working-directory: native/${{ inputs.app }}
        run: npx cap sync android

      - name: Validate release version
        run: |
          test -n "${{ inputs.versionCode }}"
          test -n "${{ inputs.versionName }}"
          case "${{ inputs.versionCode }}" in
            ''|*[!0-9]*) echo "versionCode must be a positive integer"; exit 1 ;;
          esac
          echo "Building app=${{ inputs.app }} versionName=${{ inputs.versionName }} versionCode=${{ inputs.versionCode }}"

      - name: Set version
        working-directory: native/${{ inputs.app }}/android
        run: |
          chmod +x gradlew
          ./gradlew help --no-daemon \
            -PZANA_VERSION_CODE='${{ inputs.versionCode }}' \
            -PZANA_VERSION_NAME='${{ inputs.versionName }}' \
            >/tmp/gradle-version-check.log
          grep -E "versionCode|versionName" app/build.gradle || true

      - name: Restore keystore
        working-directory: native/${{ inputs.app }}/android
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE" | base64 --decode > app/zana.jks

      - name: Build signed bundle
        working-directory: native/${{ inputs.app }}/android
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon \
            -PZANA_VERSION_CODE='${{ inputs.versionCode }}' \
            -PZANA_VERSION_NAME='${{ inputs.versionName }}' \
            -PZANA_KEYSTORE_FILE=zana.jks \
            -PZANA_KEYSTORE_PASSWORD='${{ secrets.ANDROID_KEYSTORE_PASSWORD }}' \
            -PZANA_KEY_ALIAS='${{ secrets.ANDROID_KEY_ALIAS }}' \
            -PZANA_KEY_PASSWORD='${{ secrets.ANDROID_KEY_PASSWORD }}'

      - name: Verify Driver manifest has no foreground/background location permissions
        if: inputs.app == 'driver'
        working-directory: native/driver/android
        run: |
          echo "Locating merged Driver release manifests..."
          mapfile -t MANIFESTS < <(find app/build/intermediates -type f \( -name 'merged-manifest.xml' -o -name 'AndroidManifest.xml' \) | sort)
          if [ "${#MANIFESTS[@]}" -eq 0 ]; then
            echo "ERROR: No merged Android manifest was produced."
            find app/build/intermediates -maxdepth 5 -type f | head -200 || true
            exit 1
          fi
          printf 'Found manifests:\n%s\n' "${MANIFESTS[@]}"
          for MANIFEST in "${MANIFESTS[@]}"; do
            echo "Checking $MANIFEST"
            if grep -E -n 'FOREGROUND_SERVICE|ACCESS_BACKGROUND_LOCATION|foregroundServiceType' "$MANIFEST"; then
              echo "ERROR: Driver release manifest contains a foreground-service or background-location declaration: $MANIFEST"
              exit 1
            fi
          done
          echo "OK: Driver build manifests contain no foreground-service or background-location declarations."

      - name: Collect
        run: |
          mkdir -p out
          cp native/${{ inputs.app }}/android/app/build/outputs/bundle/release/app-release.aab \
             out/zana-${{ inputs.app }}-${{ inputs.versionName }}.aab

      - name: Remove keystore
        if: always()
        run: rm -f native/${{ inputs.app }}/android/app/zana.jks

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: zana-${{ inputs.app }}-aab
          path: out/*.aab
          retention-days: 30
