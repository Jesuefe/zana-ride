name: Deploy ZANA merchant portal

on:
  push:
    branches: [main]
    paths:
      - 'merchant-web/**'
      - '.github/workflows/deploy-zana-merchant.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zana-merchant-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy merchant portal
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: merchant-web/package-lock.json
      - name: Build and deploy merchant portal
        working-directory: merchant-web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CONFIGURED_PAGES_PROJECT: ${{ vars.CLOUDFLARE_MERCHANT_PAGES_PROJECT }}
        run: |
          set -eu
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          PAGES_PROJECT="$CONFIGURED_PAGES_PROJECT"
          if [ -z "$PAGES_PROJECT" ]; then PAGES_PROJECT="zana-merchant"; fi
          npm ci
          npm run build
          npx --yes wrangler pages deploy out --project-name "$PAGES_PROJECT" --branch main
