name: Build iOS (TestFlight)

on:
  push:
    branches: [main]
    paths:
      - 'native/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    strategy:
      fail-fast: false
      matrix:
        app:
          - dir: driver
            bundle_id: rw.zanaride.driver
          - dir: customer
            bundle_id: rw.zanaride.app

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: native/${{ matrix.app.dir }}
        run: npm install

      - name: Sync Capacitor
        working-directory: native/${{ matrix.app.dir }}
        run: npx cap sync ios

      - name: Install CocoaPods
        working-directory: native/${{ matrix.app.dir }}/ios/App
        run: pod install

      - name: Set up signing keychain
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p temp_password "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p temp_password "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$KEYCHAIN_PATH"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PASSWORD=temp_password" >> "$GITHUB_ENV"

      - name: Install the App Store Connect API key
        env:
          API_KEY_BASE64: ${{ secrets.IOS_API_KEY_BASE64 }}
        run: |
          echo "$API_KEY_BASE64" | base64 --decode > ${{ runner.temp }}/asc_key.p8

      - name: Install fastlane
        run: gem install fastlane --no-document

      - name: Set up Fastfile
        run: |
          mkdir -p native/${{ matrix.app.dir }}/ios/App/fastlane
          cp native/ios-fastlane-template/Fastfile native/${{ matrix.app.dir }}/ios/App/fastlane/Fastfile

      - name: Build and upload to TestFlight
        working-directory: native/${{ matrix.app.dir }}/ios/App
        env:
          ASC_KEY_ID: "8Z8DTKTUS7"
          ASC_ISSUER_ID: "1f3de8a1-2a50-4e94-8f25-5dde456a9ab1"
          ASC_KEY_PATH: ${{ runner.temp }}/asc_key.p8
          BUNDLE_ID: ${{ matrix.app.bundle_id }}
        run: fastlane beta

      - name: Upload .ipa as a downloadable artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: zana-${{ matrix.app.dir }}-ipa
          path: native/${{ matrix.app.dir }}/ios/App/*.ipa
          if-no-files-found: warn
