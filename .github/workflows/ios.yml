name: Build iOS (TestFlight)

on:
  push:
    branches: [main]
    paths:
      - 'native/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    strategy:
      fail-fast: false
      matrix:
        app:
          - dir: driver
            bundle_id: rw.zanaride.driver
            profile_name: "Zana Driver Distribution"
            profile_secret: IOS_DRIVER_PROVISION_BASE64
          - dir: customer
            bundle_id: rw.zanaride.app
            profile_name: "Zana Customer Distribution"
            profile_secret: IOS_CUSTOMER_PROVISION_BASE64

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: native/${{ matrix.app.dir }}
        run: npm install

      - name: Sync Capacitor
        working-directory: native/${{ matrix.app.dir }}
        run: npx cap sync ios

      - name: Install CocoaPods
        working-directory: native/${{ matrix.app.dir }}/ios/App
        run: pod install

      - name: Set up signing keychain
        run: |
          security create-keychain -p temp_password build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p temp_password build.keychain
          security list-keychains -d user -s build.keychain $(security list-keychains -d user | tr -d '"')

      - name: Import distribution certificate
        env:
          CERT_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERT_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
        run: |
          echo "$CERT_BASE64" | base64 --decode > cert.p12
          security import cert.p12 -k build.keychain -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k temp_password build.keychain
          rm cert.p12

      - name: Install provisioning profile
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "${{ secrets[matrix.app.profile_secret] }}" | base64 --decode > \
            ~/Library/MobileDevice/Provisioning\ Profiles/${{ matrix.app.dir }}.mobileprovision

      - name: Install the App Store Connect API key
        env:
          API_KEY_BASE64: ${{ secrets.IOS_API_KEY_BASE64 }}
        run: |
          echo "$API_KEY_BASE64" | base64 --decode > ${{ runner.temp }}/asc_key.p8

      - name: Install fastlane
        run: gem install fastlane --no-document

      - name: Set up Fastfile
        run: |
          mkdir -p native/${{ matrix.app.dir }}/ios/App/fastlane
          cp native/ios-fastlane-template/Fastfile native/${{ matrix.app.dir }}/ios/App/fastlane/Fastfile

      - name: Build and upload to TestFlight
        working-directory: native/${{ matrix.app.dir }}/ios/App
        env:
          ASC_KEY_ID: "8Z8DTKTUS7"
          ASC_ISSUER_ID: "1f3de8a1-2a50-4e94-8f25-5dde456a9ab1"
          ASC_KEY_PATH: ${{ runner.temp }}/asc_key.p8
          BUNDLE_ID: ${{ matrix.app.bundle_id }}
          PROFILE_NAME: ${{ matrix.app.profile_name }}
        run: fastlane beta
