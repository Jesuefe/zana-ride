name: Build iOS (TestFlight)

on:
  push:
    branches: [main]
    paths:
      - 'native/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    strategy:
      fail-fast: false
      matrix:
        app:
          - dir: driver
            bundle_id: com.bastionholdings.zana.driver
          - dir: customer
            bundle_id: com.bastionholdings.zana

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: native/${{ matrix.app.dir }}
        run: npm install

      - name: Sync Capacitor
        working-directory: native/${{ matrix.app.dir }}
        run: npx cap sync ios

      - name: Install CocoaPods
        working-directory: native/${{ matrix.app.dir }}/ios/App
        run: pod install

      - name: Install the App Store Connect API key
        env:
          API_KEY_BASE64: ${{ secrets.IOS_API_KEY_BASE64 }}
        run: |
          KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_4949DJ3PMM.p8"
          mkdir -p "$(dirname "$KEY_PATH")"
          echo "$API_KEY_BASE64" | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "ASC_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Install fastlane
        run: gem install fastlane --no-document

      - name: Build archive with Xcode cloud signing
        working-directory: native/${{ matrix.app.dir }}/ios/App
        run: |
          rm -rf build
          mkdir -p build

          xcodebuild             -workspace App.xcworkspace             -scheme App             -configuration Release             -destination "generic/platform=iOS"             -archivePath "$PWD/build/App.xcarchive"             DEVELOPMENT_TEAM=BX52G3KQ85             PRODUCT_BUNDLE_IDENTIFIER="${{ matrix.app.bundle_id }}"             CODE_SIGN_STYLE=Automatic             CODE_SIGN_IDENTITY="Apple Distribution"             -allowProvisioningUpdates             -authenticationKeyPath "$ASC_KEY_PATH"             -authenticationKeyID "4949DJ3PMM"             -authenticationKeyIssuerID "78eef06e-8cf0-4f3d-9c62-380ae304adee"             clean archive

      - name: Export signed IPA
        working-directory: native/${{ matrix.app.dir }}/ios/App
        run: |
          cat > build/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>BX52G3KQ85</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF

          xcodebuild             -exportArchive             -archivePath "$PWD/build/App.xcarchive"             -exportPath "$PWD/build/export"             -exportOptionsPlist "$PWD/build/ExportOptions.plist"             -allowProvisioningUpdates             -authenticationKeyPath "$ASC_KEY_PATH"             -authenticationKeyID "4949DJ3PMM"             -authenticationKeyIssuerID "78eef06e-8cf0-4f3d-9c62-380ae304adee"

          cp build/export/*.ipa build/zana-${{ matrix.app.dir }}.ipa

      - name: Upload to TestFlight
        working-directory: native/${{ matrix.app.dir }}/ios/App
        run: |
          fastlane pilot upload             --ipa "build/zana-${{ matrix.app.dir }}.ipa"             --app_identifier "${{ matrix.app.bundle_id }}"             --skip_waiting_for_build_processing true             --api_key_path <(python3 - <<'PY'
          import json, os
          print(json.dumps({
              "key_id": "4949DJ3PMM",
              "issuer_id": "78eef06e-8cf0-4f3d-9c62-380ae304adee",
              "key": open(os.environ["ASC_KEY_PATH"]).read()
          }))
          PY
          )

      - name: Upload .ipa as a downloadable artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: zana-${{ matrix.app.dir }}-ipa
          path: native/${{ matrix.app.dir }}/ios/App/build/*.ipa
          if-no-files-found: warn
