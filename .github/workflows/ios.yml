name: Build iOS (TestFlight)

on:
  push:
    branches: [main]
    paths:
      - 'native/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    strategy:
      fail-fast: false
      matrix:
        app:
          - dir: driver
            bundle_id: com.bastionholdings.zana.driver
          - dir: customer
            bundle_id: com.bastionholdings.zana

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: native/${{ matrix.app.dir }}
        run: npm install

      - name: Sync Capacitor
        working-directory: native/${{ matrix.app.dir }}
        run: npx cap sync ios

      - name: Install CocoaPods
        working-directory: native/${{ matrix.app.dir }}/ios/App
        run: pod install

      - name: Install the App Store Connect API key
        env:
          API_KEY_BASE64: ${{ secrets.IOS_API_KEY_BASE64 }}
        run: |
          KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_4949DJ3PMM.p8"
          mkdir -p "$(dirname "$KEY_PATH")"
          echo "$API_KEY_BASE64" | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "ASC_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

          API_JSON="$RUNNER_TEMP/appstoreconnect_api.json"
          python3 - "$KEY_PATH" "$API_JSON" <<'PY'
          import json, sys
          key_path, json_path = sys.argv[1], sys.argv[2]
          with open(key_path, "r", encoding="utf-8") as f:
              key = f.read()
          with open(json_path, "w", encoding="utf-8") as f:
              json.dump({
                  "key_id": "4949DJ3PMM",
                  "issuer_id": "78eef06e-8cf0-4f3d-9c62-380ae304adee",
                  "key": key,
                  "in_house": False
              }, f)
          PY
          chmod 600 "$API_JSON"
          echo "ASC_API_JSON=$API_JSON" >> "$GITHUB_ENV"

      - name: Install fastlane
        run: gem install fastlane --no-document

      - name: Build archive with Xcode cloud signing
        working-directory: native/${{ matrix.app.dir }}/ios/App
        run: |
          rm -rf build
          mkdir -p build

          xcodebuild             -workspace App.xcworkspace             -scheme App             -configuration Release             -destination "generic/platform=iOS"             -archivePath "$PWD/build/App.xcarchive"             DEVELOPMENT_TEAM=BX52G3KQ85             CURRENT_PROJECT_VERSION="${{ github.run_number }}"             IPHONEOS_DEPLOYMENT_TARGET=15.0             CODE_SIGN_STYLE=Automatic             CODE_SIGNING_ALLOWED=NO             CODE_SIGNING_REQUIRED=NO             -allowProvisioningUpdates             -authenticationKeyPath "$ASC_KEY_PATH"             -authenticationKeyID "4949DJ3PMM"             -authenticationKeyIssuerID "78eef06e-8cf0-4f3d-9c62-380ae304adee"             clean archive

      - name: Export signed IPA
        working-directory: native/${{ matrix.app.dir }}/ios/App
        run: |
          cat > build/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>BX52G3KQ85</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF

          xcodebuild             -exportArchive             -archivePath "$PWD/build/App.xcarchive"             -exportPath "$PWD/build/export"             -exportOptionsPlist "$PWD/build/ExportOptions.plist"             -allowProvisioningUpdates             -authenticationKeyPath "$ASC_KEY_PATH"             -authenticationKeyID "4949DJ3PMM"             -authenticationKeyIssuerID "78eef06e-8cf0-4f3d-9c62-380ae304adee"

          cp build/export/*.ipa build/zana-${{ matrix.app.dir }}.ipa

      - name: Validate exported IPA bundle identifiers
        working-directory: native/${{ matrix.app.dir }}/ios/App
        run: |
          rm -rf build/ipa-check
          mkdir -p build/ipa-check
          unzip -q "build/zana-${{ matrix.app.dir }}.ipa" -d build/ipa-check

          python3 - <<'PY'
          import plistlib
          from pathlib import Path
          from collections import defaultdict

          payload = Path("build/ipa-check/Payload")
          apps = list(payload.glob("*.app"))
          if len(apps) != 1:
              raise SystemExit(f"Expected exactly one app bundle in IPA, found {len(apps)}")

          app = apps[0]
          grouped = defaultdict(list)
          for plist_path in app.rglob("Info.plist"):
              try:
                  with plist_path.open("rb") as f:
                      info = plistlib.load(f)
                  bundle_id = info.get("CFBundleIdentifier")
                  if bundle_id:
                      grouped[bundle_id].append(str(plist_path.relative_to(app)))
              except Exception:
                  pass

          print("Exported bundle identifiers:")
          for bundle_id, paths in sorted(grouped.items()):
              print(f"  {bundle_id}")
              for path in paths:
                  print(f"    - {path}")

          expected = "${{ matrix.app.bundle_id }}"
          root_info = plistlib.loads((app / "Info.plist").read_bytes())
          actual = root_info.get("CFBundleIdentifier")
          if actual != expected:
              raise SystemExit(f"Root app bundle ID mismatch: expected {expected}, got {actual}")

          duplicates = {k: v for k, v in grouped.items() if len(v) > 1}
          if duplicates:
              print("\nERROR: duplicate CFBundleIdentifier values found:")
              for bundle_id, paths in duplicates.items():
                  print(f"  {bundle_id}:")
                  for path in paths:
                      print(f"    - {path}")
              raise SystemExit(1)
          PY

      - name: Upload to TestFlight
        working-directory: native/${{ matrix.app.dir }}/ios/App
        run: |
          fastlane pilot upload \
            --ipa "build/zana-${{ matrix.app.dir }}.ipa" \
            --app_identifier "${{ matrix.app.bundle_id }}" \
            --skip_waiting_for_build_processing true \
            --api_key_path "$ASC_API_JSON"

      - name: Upload .ipa as a downloadable artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: zana-${{ matrix.app.dir }}-ipa
          path: native/${{ matrix.app.dir }}/ios/App/build/*.ipa
          if-no-files-found: warn
