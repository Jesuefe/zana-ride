name: Build iOS (TestFlight)

on:
  push:
    branches: [main]
    paths:
      - 'native/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    strategy:
      fail-fast: false
      matrix:
        app:
          - dir: customer
            bundle_id: rw.zanaride.customer

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: native/${{ matrix.app.dir }}
        run: npm install

      - name: Sync Capacitor
        working-directory: native/${{ matrix.app.dir }}
        run: npx cap sync ios

      - name: Install CocoaPods
        working-directory: native/${{ matrix.app.dir }}/ios/App
        run: pod install

      - name: Import signing certificate and provisioning profile
        env:
          CERT_B64: ${{ secrets.IOS_DIST_CERT_B64 }}
          KEY_ENC_B64: ${{ secrets.IOS_DIST_KEY_ENC_B64 }}
          KEY_PASSPHRASE: ${{ secrets.IOS_CERT_KEY_PASSPHRASE }}
          PROFILE_B64: ${{ secrets.IOS_PROFILE_B64 }}
        run: |
          set -euo pipefail
          for v in CERT_B64 KEY_ENC_B64 KEY_PASSPHRASE PROFILE_B64; do
            if [ -z "${!v}" ]; then echo "::error::Missing secret for $v"; exit 1; fi
          done
          W="$RUNNER_TEMP/sign"; mkdir -p "$W"
          echo "$CERT_B64" | base64 --decode > "$W/cert.cer"
          echo "$KEY_ENC_B64" | base64 --decode > "$W/key.enc"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:KEY_PASSPHRASE -in "$W/key.enc" -out "$W/key.pem"
          openssl x509 -inform der -in "$W/cert.cer" -out "$W/cert.pem"
          P12PW="$(openssl rand -hex 16)"
          openssl pkcs12 -export -inkey "$W/key.pem" -in "$W/cert.pem" -out "$W/cert.p12" -passout "pass:$P12PW"

          KC="$RUNNER_TEMP/build.keychain-db"; KCPW="$(openssl rand -hex 16)"
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          security import "$W/cert.p12" -k "$KC" -P "$P12PW" -A -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KCPW" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" login.keychain-db
          security find-identity -v -p codesigning "$KC"

          echo "$PROFILE_B64" | base64 --decode > "$W/profile.mobileprovision"
          security cms -D -i "$W/profile.mobileprovision" > "$W/profile.plist"
          PUUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$W/profile.plist")
          PNAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$W/profile.plist")
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$W/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$PUUID.mobileprovision"
          echo "PROFILE_NAME=$PNAME" >> "$GITHUB_ENV"
          echo "Installed profile: $PNAME"

      - name: Build archive (unsigned)
        working-directory: native/${{ matrix.app.dir }}/ios/App
        run: |
          rm -rf build; mkdir -p build
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release \
            -destination "generic/platform=iOS" -archivePath "$PWD/build/App.xcarchive" \
            DEVELOPMENT_TEAM=65WTVA72SM CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            clean archive

      - name: Export signed IPA (manual signing)
        working-directory: native/${{ matrix.app.dir }}/ios/App
        run: |
          cat > build/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store</string>
            <key>teamID</key><string>65WTVA72SM</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict><key>${{ matrix.app.bundle_id }}</key><string>$PROFILE_NAME</string></dict>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive -archivePath "$PWD/build/App.xcarchive" \
            -exportPath "$PWD/build/export" -exportOptionsPlist "$PWD/build/ExportOptions.plist"
          cp build/export/*.ipa build/zana-${{ matrix.app.dir }}.ipa

      - name: Validate exported IPA bundle identifiers
        working-directory: native/${{ matrix.app.dir }}/ios/App
        run: |
          rm -rf build/ipa-check
          mkdir -p build/ipa-check
          unzip -q "build/zana-${{ matrix.app.dir }}.ipa" -d build/ipa-check

          python3 - <<'PY'
          import plistlib
          from pathlib import Path
          from collections import defaultdict

          payload = Path("build/ipa-check/Payload")
          apps = list(payload.glob("*.app"))
          if len(apps) != 1:
              raise SystemExit(f"Expected exactly one app bundle in IPA, found {len(apps)}")

          app = apps[0]
          grouped = defaultdict(list)
          for plist_path in app.rglob("Info.plist"):
              try:
                  with plist_path.open("rb") as f:
                      info = plistlib.load(f)
                  bundle_id = info.get("CFBundleIdentifier")
                  if bundle_id:
                      grouped[bundle_id].append(str(plist_path.relative_to(app)))
              except Exception:
                  pass

          print("Exported bundle identifiers:")
          for bundle_id, paths in sorted(grouped.items()):
              print(f"  {bundle_id}")
              for path in paths:
                  print(f"    - {path}")

          expected = "${{ matrix.app.bundle_id }}"
          root_info = plistlib.loads((app / "Info.plist").read_bytes())
          actual = root_info.get("CFBundleIdentifier")
          if actual != expected:
              raise SystemExit(f"Root app bundle ID mismatch: expected {expected}, got {actual}")

          duplicates = {k: v for k, v in grouped.items() if len(v) > 1}
          if duplicates:
              print("\nERROR: duplicate CFBundleIdentifier values found:")
              for bundle_id, paths in duplicates.items():
                  print(f"  {bundle_id}:")
                  for path in paths:
                      print(f"    - {path}")
              raise SystemExit(1)
          PY

      - name: Upload to TestFlight
        working-directory: native/${{ matrix.app.dir }}/ios/App
        env:
          APPLE_ID: ${{ secrets.IOS_APPLE_ID }}
          APP_PASSWORD: ${{ secrets.IOS_APP_SPECIFIC_PASSWORD }}
        run: |
          xcrun altool --upload-app -f "build/zana-${{ matrix.app.dir }}.ipa" -t ios \
            -u "$APPLE_ID" -p "$APP_PASSWORD"

      - name: Upload .ipa as a downloadable artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: zana-${{ matrix.app.dir }}-ipa
          path: native/${{ matrix.app.dir }}/ios/App/build/*.ipa
          if-no-files-found: warn
