name: Build Zana Customer iOS (TestFlight)

on:
  push:
    branches: [main]
    paths:
      - 'native/customer/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-customer:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Validate Apple signing configuration
        env:
          API_KEY_BASE64: ${{ secrets.IOS_API_KEY_BASE64 }}
          API_KEY_ID: ${{ vars.IOS_ASC_KEY_ID }}
          API_ISSUER_ID: ${{ vars.IOS_ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ vars.IOS_TEAM_ID }}
        run: |
          test -n "$API_KEY_BASE64" || { echo "::error::Missing IOS_API_KEY_BASE64 secret"; exit 1; }
          test -n "$API_KEY_ID" || { echo "::error::Missing IOS_ASC_KEY_ID repository variable"; exit 1; }
          test -n "$API_ISSUER_ID" || { echo "::error::Missing IOS_ASC_ISSUER_ID repository variable"; exit 1; }
          test "$APPLE_TEAM_ID" = "65WTVA72SM" || { echo "::error::Set IOS_TEAM_ID repository variable to 65WTVA72SM"; exit 1; }

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: native/customer/package-lock.json

      - name: Install dependencies
        working-directory: native/customer
        run: npm install

      - name: Sync Capacitor
        working-directory: native/customer
        run: npx cap sync ios

      - name: Install CocoaPods
        working-directory: native/customer/ios/App
        run: pod install

      - name: Install App Store Connect API key
        env:
          API_KEY_BASE64: ${{ secrets.IOS_API_KEY_BASE64 }}
          API_KEY_ID: ${{ vars.IOS_ASC_KEY_ID }}
          API_ISSUER_ID: ${{ vars.IOS_ASC_ISSUER_ID }}
        run: |
          KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${API_KEY_ID}.p8"
          mkdir -p "$(dirname "$KEY_PATH")"
          printf '%s' "$API_KEY_BASE64" | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "ASC_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"
          echo "ASC_KEY_ID=$API_KEY_ID" >> "$GITHUB_ENV"
          echo "ASC_ISSUER_ID=$API_ISSUER_ID" >> "$GITHUB_ENV"
          API_JSON="$RUNNER_TEMP/appstoreconnect_api.json"
          python3 - "$KEY_PATH" "$API_JSON" "$API_KEY_ID" "$API_ISSUER_ID" <<'PY'
          import json, sys
          key_path, json_path, key_id, issuer_id = sys.argv[1:]
          with open(key_path, encoding="utf-8") as f:
              key = f.read()
          with open(json_path, "w", encoding="utf-8") as f:
              json.dump({"key_id": key_id, "issuer_id": issuer_id, "key": key, "in_house": False}, f)
          PY
          chmod 600 "$API_JSON"
          echo "ASC_API_JSON=$API_JSON" >> "$GITHUB_ENV"

      - name: Install fastlane
        run: gem install fastlane --no-document

      - name: Build signed customer archive
        working-directory: native/customer/ios/App
        env:
          APPLE_TEAM_ID: ${{ vars.IOS_TEAM_ID }}
        run: |
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$PWD/build/ZanaCustomer.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="rw.zanaride.customer" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            CODE_SIGN_STYLE=Automatic \
            CODE_SIGNING_ALLOWED=YES \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            clean archive

      - name: Export signed customer IPA
        working-directory: native/customer/ios/App
        env:
          APPLE_TEAM_ID: ${{ vars.IOS_TEAM_ID }}
        run: |
          mkdir -p build
          cat > build/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$PWD/build/ZanaCustomer.xcarchive" \
            -exportPath "$PWD/build/export" \
            -exportOptionsPlist "$PWD/build/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          IPA="$(find build/export -maxdepth 1 -name '*.ipa' -print -quit)"
          test -n "$IPA" || { echo "::error::Xcode did not export an IPA"; exit 1; }
          cp "$IPA" build/zana-customer.ipa

      - name: Verify customer bundle identifier
        working-directory: native/customer/ios/App
        run: |
          rm -rf build/ipa-check
          mkdir -p build/ipa-check
          unzip -q build/zana-customer.ipa -d build/ipa-check
          APP_PATH="$(find build/ipa-check/Payload -maxdepth 1 -name '*.app' -print -quit)"
          ACTUAL=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist")
          echo "Built bundle ID: $ACTUAL"
          test "$ACTUAL" = "rw.zanaride.customer" || { echo "::error::Unexpected bundle ID $ACTUAL"; exit 1; }

      - name: Upload customer app to TestFlight
        working-directory: native/customer/ios/App
        run: |
          fastlane pilot upload \
            --ipa build/zana-customer.ipa \
            --app_identifier "rw.zanaride.customer" \
            --skip_waiting_for_build_processing true \
            --api_key_path "$ASC_API_JSON"

      - name: Save IPA artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: zana-customer-ipa
          path: native/customer/ios/App/build/*.ipa
          if-no-files-found: warn
