name: Build Zana Merchant APK

on:
  push:
    paths:
      - 'merchant/**'
      - 'native/customer/**'
      - '.github/workflows/android-merchant-apk.yml'
  workflow_dispatch:
    inputs:
      versionName:
        description: "Merchant app version"
        required: true
        default: "1.0.2"
      versionCode:
        description: "Android version code"
        required: true
        default: "3"

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Create merchant native shell
        run: |
          set -euo pipefail
          rm -rf native/merchant
          cp -R native/customer native/merchant
          python3 - <<'PY'
          import json
          p="native/merchant/capacitor.config.json"
          c=json.load(open(p))
          c["appId"]="rw.zanaride.merchant"
          c["appName"]="Zana Merchant"
          c["server"]["url"]="https://merchant.zanaride.rw"
          open(p,"w").write(json.dumps(c,indent=2)+"\n")
          PY
          sed -i 's/rw\.zanaride\.app/rw.zanaride.merchant/g' native/merchant/android/app/build.gradle
          sed -i 's/rw\.zanaride\.app/rw.zanaride.merchant/g' native/merchant/android/app/src/main/AndroidManifest.xml
          mkdir -p native/merchant/android/app/src/main/java/rw/zanaride/merchant
          cp native/merchant/android/app/src/main/java/rw/zanaride/app/MainActivity.java native/merchant/android/app/src/main/java/rw/zanaride/merchant/MainActivity.java
          sed -i 's/package rw\.zanaride\.app;/package rw.zanaride.merchant;/' native/merchant/android/app/src/main/java/rw/zanaride/merchant/MainActivity.java
          rm -rf native/merchant/android/app/src/main/java/rw/zanaride/app

      - name: Install dependencies
        working-directory: native/merchant
        run: npm install

      - name: Sync Android
        working-directory: native/merchant
        run: npx cap sync android

      - name: Apply Zana Merchant launcher icon
        shell: bash
        run: |
          set -euo pipefail
          ICON_URL="https://showmine112.b-cdn.net/89ba9d07-8597-426f-8ec8-1f610bb18586.png"
          curl -fL --retry 5 --retry-all-errors --connect-timeout 15 -o /tmp/zana-merchant-icon.png "$ICON_URL"
          test -s /tmp/zana-merchant-icon.png
          RES="native/merchant/android/app/src/main/res"

          rm -rf "$RES"/mipmap-anydpi "$RES"/mipmap-anydpi-v26
          find "$RES" -type f \( -name 'ic_launcher_foreground.*' -o -name 'ic_launcher_background.*' \) -delete

          sudo apt-get update
          sudo apt-get install -y imagemagick
          command -v convert
          convert -version | head -n 1

          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "$RES/mipmap-$d"
          done

          convert /tmp/zana-merchant-icon.png -auto-orient -resize 48x48! "$RES/mipmap-mdpi/ic_launcher.png"
          convert /tmp/zana-merchant-icon.png -auto-orient -resize 72x72! "$RES/mipmap-hdpi/ic_launcher.png"
          convert /tmp/zana-merchant-icon.png -auto-orient -resize 96x96! "$RES/mipmap-xhdpi/ic_launcher.png"
          convert /tmp/zana-merchant-icon.png -auto-orient -resize 144x144! "$RES/mipmap-xxhdpi/ic_launcher.png"
          convert /tmp/zana-merchant-icon.png -auto-orient -resize 192x192! "$RES/mipmap-xxxhdpi/ic_launcher.png"

          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp "$RES/mipmap-$d/ic_launcher.png" "$RES/mipmap-$d/ic_launcher_round.png"
          done

          echo "Generated Merchant launcher resources:"
          find "$RES" -type f | grep -E 'mipmap-.*/ic_launcher(_round)?\.png$' | sort

          if find "$RES" -type f -path '*/mipmap-anydpi*/*' | grep -q .; then
            echo "ERROR: adaptive launcher resources still exist"
            exit 1
          fi

      - name: Build signed APK
        working-directory: native/merchant/android
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$KEYSTORE" | base64 --decode > app/zana.jks
          chmod +x gradlew
          ./gradlew clean assembleRelease --no-daemon \
            -PZANA_VERSION_CODE='${{ inputs.versionCode || '3' }}' \
            -PZANA_VERSION_NAME='${{ inputs.versionName || '1.0.2' }}' \
            -PZANA_KEYSTORE_FILE=zana.jks \
            -PZANA_KEYSTORE_PASSWORD="$STORE_PASSWORD" \
            -PZANA_KEY_ALIAS="$KEY_ALIAS" \
            -PZANA_KEY_PASSWORD="$KEY_PASSWORD"

      - name: Verify APK contains merchant launcher resources
        working-directory: native/merchant/android
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"

          echo "Generated launcher source files:"
          find app/src/main/res -type f -path '*/mipmap-*/*' \
            \( -name 'ic_launcher.png' -o -name 'ic_launcher_round.png' \) | sort

          COUNT=$(find app/src/main/res -type f -name 'ic_launcher.png' | wc -l)
          ROUND_COUNT=$(find app/src/main/res -type f -name 'ic_launcher_round.png' | wc -l)
          test "$COUNT" -ge 5
          test "$ROUND_COUNT" -ge 5

          AAPT2="$(find "$ANDROID_HOME" -type f -name aapt2 -print -quit)"
          test -x "$AAPT2"
          echo "Compiled launcher resources:"
          "$AAPT2" dump resources "$APK" | grep -E 'ic_launcher(_round)?' | head -n 30

          RESOURCE_DUMP="$("$AAPT2" dump resources "$APK")"
          echo "$RESOURCE_DUMP" | grep -Eq 'mipmap/ic_launcher(_round)?$'
          echo "Merchant launcher icon verification passed."

      - name: Collect APK
        run: |
          set -euo pipefail
          mkdir -p out
          cp native/merchant/android/app/build/outputs/apk/release/app-release.apk "out/zana-merchant-${{ inputs.versionName || '1.0.2' }}.apk"

      - name: Remove signing key
        if: always()
        run: rm -f native/merchant/android/app/zana.jks

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: zana-merchant-apk
          path: out/*.apk
          retention-days: 30
