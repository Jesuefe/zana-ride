name: Deploy Zana admin safety preview
on:
  push:
    branches: [feat/safety-command-center-20261107]
    paths:
      - 'admin-web/**'
      - '.github/workflows/deploy-zana-admin-preview.yml'
permissions:
  contents: read
concurrency:
  group: zana-admin-safety-preview
  cancel-in-progress: false
jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin-web/package-lock.json
      - name: Build and deploy isolated preview
        if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        working-directory: admin-web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -eu
          npm ci
          npm run build
          npx --yes wrangler pages deploy out --project-name zana-admin --branch safety-command-center
      - name: Explain preview deployment requirement
        if: ${{ secrets.CLOUDFLARE_API_TOKEN == '' || secrets.CLOUDFLARE_ACCOUNT_ID == '' }}
        run: echo "::warning::Preview build is ready, but Cloudflare deployment is waiting for CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in the production GitHub environment."
