name: Inspect App Store Connect Build Uploads

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/inspect-asc-build.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Query App Store Connect build uploads
        env:
          IOS_API_KEY_BASE64: ${{ secrets.IOS_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          python3 -m pip install --quiet PyJWT cryptography
          python3 - <<'PY'
          import base64, json, os, time, urllib.request, urllib.error
          import jwt

          private_key = base64.b64decode(os.environ["IOS_API_KEY_BASE64"]).decode("utf-8")
          now = int(time.time())
          token = jwt.encode(
              {
                  "iss": "78eef06e-8cf0-4f3d-9c62-380ae304adee",
                  "iat": now,
                  "exp": now + 1200,
                  "aud": "appstoreconnect-v1",
              },
              private_key,
              algorithm="ES256",
              headers={"kid": "4949DJ3PMM", "typ": "JWT"},
          )

          url = (
              "https://api.appstoreconnect.apple.com/v1/apps/6814947776/buildUploads"
              "?filter[platform]=IOS&sort=-uploadedDate&limit=10"
              "&fields[buildUploads]=cfBundleShortVersionString,cfBundleVersion,createdDate,state,platform,uploadedDate,build"
              "&include=build"
              "&fields[builds]=version,uploadedDate,processingState,app,buildUpload"
          )
          req = urllib.request.Request(
              url,
              headers={"Authorization": "Bearer " + token, "Accept": "application/json"},
          )
          try:
              with urllib.request.urlopen(req, timeout=30) as resp:
                  data = json.load(resp)
              print(json.dumps(data, indent=2))
          except urllib.error.HTTPError as e:
              print("HTTP", e.code)
              print(e.read().decode("utf-8", errors="replace"))
              raise
          PY
