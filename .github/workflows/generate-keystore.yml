name: Generate Android signing keystore (one-time)

# Run this ONCE to create the signing key for Play Store releases.
# Passwords are generated randomly here rather than typed in, so they
# never appear in the workflow's own log output — they come back to
# you only inside the downloaded artifact zip.
#
# After downloading and saving the artifact somewhere safe, delete
# this workflow file and the run itself. Anyone with write access to
# this repo could otherwise re-run it and generate a second keystore.

on: workflow_dispatch

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Generate keystore and passwords
        run: |
          STORE_PASS=$(openssl rand -base64 24 | tr -dc 'a-zA-Z0-9' | head -c 24)
          KEY_PASS=$(openssl rand -base64 24 | tr -dc 'a-zA-Z0-9' | head -c 24)

          keytool -genkey -v -keystore zana.jks -keyalg RSA -keysize 2048 \
            -validity 10000 -alias zana \
            -storepass "$STORE_PASS" -keypass "$KEY_PASS" \
            -dname "CN=Zana Ride, OU=Bastion Holdings, O=Bastion Holdings, L=Kigali, ST=Kigali, C=RW"

          base64 -w 0 zana.jks > zana-base64.txt

          mkdir -p out
          cp zana.jks out/
          cp zana-base64.txt out/
          {
            echo "Keystore alias: zana"
            echo "Keystore password (ANDROID_KEYSTORE_PASSWORD): $STORE_PASS"
            echo "Key password (ANDROID_KEY_PASSWORD): $KEY_PASS"
            echo ""
            echo "ANDROID_KEYSTORE_BASE64 is the full content of zana-base64.txt"
            echo ""
            echo "Add all four as GitHub repo secrets, then delete this workflow"
            echo "file and this run — guard zana.jks itself somewhere safe outside"
            echo "GitHub too. Losing it means you can never update the app under"
            echo "the same identity again."
          } > out/READ-ME-passwords.txt

      - uses: actions/upload-artifact@v4
        with:
          name: zana-keystore-KEEP-PRIVATE
          path: out/*
          retention-days: 1
