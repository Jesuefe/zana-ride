name: Customer Web CI

on:
  push:
    paths:
      - 'customer-web/**'
      - '.github/workflows/customer-web-ci.yml'
  pull_request:
    paths:
      - 'customer-web/**'
      - '.github/workflows/customer-web-ci.yml'

concurrency:
  group: customer-web-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: customer-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: customer-web/package-lock.json
      - run: npm ci
      - name: Validate production Maps key
        if: github.event_name == 'push'
        env:
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
        run: |
          if [[ ! "$NEXT_PUBLIC_GOOGLE_MAPS_API_KEY" =~ ^AIza[0-9A-Za-z_-]{30,}$ ]]; then
            echo "::error::NEXT_PUBLIC_GOOGLE_MAPS_API_KEY is missing or malformed. Set the full browser API key in GitHub Actions secrets."
            exit 1
          fi
      - name: Build customer frontend
        env:
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
        run: npm run build
