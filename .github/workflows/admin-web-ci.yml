name: Admin Web CI

on:
  push:
    branches: ["**"]
    paths:
      - 'admin-web/**'
      - '.github/workflows/admin-web-ci.yml'
  pull_request:
    paths:
      - 'admin-web/**'
      - '.github/workflows/admin-web-ci.yml'

concurrency:
  group: admin-web-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin-web/package-lock.json
      - run: npm ci
      - run: npm run build
