name: Deploy Zana admin dashboard
on:
  push:
    branches: [main]
    paths:
      - 'admin-web/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zana-admin-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin-web/package-lock.json
      - name: Build and deploy admin dashboard
        working-directory: admin-web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -eu
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npm ci
          npm run build
          npx --yes wrangler pages deploy out --project-name zana-admin --branch main
