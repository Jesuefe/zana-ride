name: Deploy ZANA frontend to Cloudflare Pages
on:
  workflow_dispatch:
    inputs:
      target:
        description: Frontend to deploy
        required: true
        type: choice
        options: [admin, customer, driver, landing]
permissions:
  contents: read
jobs:
  deploy:
    name: Build and deploy selected frontend
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Select project and directory
        id: target
        env:
          TARGET: ${{ inputs.target }}
          ADMIN_PROJECT: ${{ vars.CLOUDFLARE_ADMIN_PAGES_PROJECT }}
          CUSTOMER_PROJECT: ${{ vars.CLOUDFLARE_CUSTOMER_PAGES_PROJECT }}
          DRIVER_PROJECT: ${{ vars.CLOUDFLARE_DRIVER_PAGES_PROJECT }}
          LANDING_PROJECT: ${{ vars.CLOUDFLARE_LANDING_PAGES_PROJECT }}
        run: |
          set -eu
          case "$TARGET" in
            admin) PROJECT="${ADMIN_PROJECT:-zana-admin}"; DIRECTORY=admin-web ;;
            customer) PROJECT="${CUSTOMER_PROJECT:-zana-ride}"; DIRECTORY=customer-web ;;
            driver) PROJECT="${DRIVER_PROJECT:-zana-driver}"; DIRECTORY=driver-web ;;
            landing) PROJECT="${LANDING_PROJECT:-zana-landing}"; DIRECTORY=landing ;;
            *) exit 1 ;;
          esac
          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"
          echo "directory=$DIRECTORY" >> "$GITHUB_OUTPUT"
      - name: Check deployment credentials
        env:
          TARGET: ${{ inputs.target }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
        run: |
          set -eu
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          if [ "$TARGET" = "customer" ]; then
            if [[ ! "$NEXT_PUBLIC_GOOGLE_MAPS_API_KEY" =~ ^AIza[0-9A-Za-z_-]{30,}$ ]]; then
              echo "::error::NEXT_PUBLIC_GOOGLE_MAPS_API_KEY is missing or malformed. Set the full browser API key in GitHub Actions secrets."
              exit 1
            fi
          fi
      - name: Install dependencies
        working-directory: ${{ steps.target.outputs.directory }}
        run: npm ci
      - name: Build static frontend
        working-directory: ${{ steps.target.outputs.directory }}
        env:
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
        run: npm run build
      - name: Deploy to Cloudflare Pages
        working-directory: ${{ steps.target.outputs.directory }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAGES_PROJECT: ${{ steps.target.outputs.project }}
        run: npx --yes wrangler pages deploy out --project-name "$PAGES_PROJECT" --branch main
